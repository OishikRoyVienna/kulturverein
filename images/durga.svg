<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150">
  <!-- Gesicht der Durga mit Mukut (Krone). Eigene Zeichnung, frei verwendbar. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE38E"/>
      <stop offset=".45" stop-color="#E9AE2F"/>
      <stop offset="1" stop-color="#A9640E"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset=".5" stop-color="#E2A22A"/>
      <stop offset="1" stop-color="#9E5B0C"/>
    </linearGradient>
    <radialGradient id="skin" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#FAD3A6"/>
      <stop offset=".7" stop-color="#EDB07A"/>
      <stop offset="1" stop-color="#D38E55"/>
    </radialGradient>
    <radialGradient id="ruby" cx=".38" cy=".35" r=".7">
      <stop offset="0" stop-color="#FF8A8A"/>
      <stop offset=".45" stop-color="#D0182A"/>
      <stop offset="1" stop-color="#6E0610"/>
    </radialGradient>
    <radialGradient id="iris" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7A4A22"/>
      <stop offset="1" stop-color="#3A200C"/>
    </radialGradient>
    <!-- Perlenreihen: gepunktete Linien -->
    <style>
      .beads { fill: none; stroke: #FFF1B8; stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 0 2.6; }
      .edge  { fill: none; stroke: #7A4308; stroke-width: .7; }
    </style>
    <path id="paisley" d="M40 68 C 24 60, 4 68, 3 88 C 2 106, 18 114, 30 108 C 40 103, 42 92, 38 84 Z"/>
  </defs>

  <!-- Hohe Krone hinten -->
  <path d="M18 84 C 14 54, 38 34, 60 2 C 82 34, 106 54, 102 84 Z" fill="url(#gold)"/>
  <path class="edge" d="M18 84 C 14 54, 38 34, 60 2 C 82 34, 106 54, 102 84"/>
  <path class="beads" d="M23 80 C 20 56, 42 38, 60 10 C 78 38, 100 56, 97 80"/>
  <path d="M30 78 C 28 58, 46 44, 60 22 C 74 44, 92 58, 90 78 Z" fill="#C98718"/>
  <path class="beads" d="M34 76 C 33 60, 48 48, 60 30 C 72 48, 87 60, 86 76"/>

  <!-- Seitliche Paisley-Ornamente -->
  <g>
    <use href="#paisley" fill="url(#goldSide)"/>
    <use href="#paisley" class="edge"/>
    <path class="beads" d="M36 72 C 22 66, 8 72, 7.5 88 C 7 102, 19 109, 29 104"/>
    <path d="M24 82 C 30 84, 32 92, 28 98 C 24 103, 15 101, 14 94 C 13 87, 18 82, 24 82 Z" fill="#C98718" stroke="#7A4308" stroke-width=".5"/>
    <path class="beads" d="M23 85 C 28 87, 29 93, 26 96 C 23 99, 17 98, 17 93 C 17 88, 20 85, 23 85"/>
    <circle cx="22" cy="91.5" r="2.4" fill="url(#ruby)"/>
  </g>
  <g transform="translate(120 0) scale(-1 1)">
    <use href="#paisley" fill="url(#goldSide)"/>
    <use href="#paisley" class="edge"/>
    <path class="beads" d="M36 72 C 22 66, 8 72, 7.5 88 C 7 102, 19 109, 29 104"/>
    <path d="M24 82 C 30 84, 32 92, 28 98 C 24 103, 15 101, 14 94 C 13 87, 18 82, 24 82 Z" fill="#C98718" stroke="#7A4308" stroke-width=".5"/>
    <path class="beads" d="M23 85 C 28 87, 29 93, 26 96 C 23 99, 17 98, 17 93 C 17 88, 20 85, 23 85"/>
    <circle cx="22" cy="91.5" r="2.4" fill="url(#ruby)"/>
  </g>

  <!-- Hals -->
  <path d="M49 108 L 48 132 L 72 132 L 71 108 Z" fill="#D9955D"/>

  <!-- Halsschmuck -->
  <path d="M32 116 C 40 132, 80 132, 88 116 L 94 128 C 82 146, 38 146, 26 128 Z" fill="url(#gold)"/>
  <path class="edge" d="M32 116 C 40 132, 80 132, 88 116 L 94 128 C 82 146, 38 146, 26 128 Z"/>
  <path class="beads" d="M30 124 C 42 140, 78 140, 90 124"/>
  <path d="M60 132 C 66 138, 66 146, 60 149 C 54 146, 54 138, 60 132 Z" fill="url(#gold)" stroke="#7A4308" stroke-width=".6"/>
  <circle cx="60" cy="142" r="2.6" fill="url(#ruby)"/>

  <!-- Haar hinter dem Gesicht -->
  <ellipse cx="60" cy="86" rx="28" ry="32" fill="#1B1010"/>

  <!-- Gesicht -->
  <path d="M60 58 C 76 58, 84 72, 83 88 C 82 104, 72 118, 60 120 C 48 118, 38 104, 37 88 C 36 72, 44 58, 60 58 Z" fill="url(#skin)"/>
  <ellipse cx="46" cy="100" rx="6" ry="4" fill="#E88A6A" opacity=".35"/>
  <ellipse cx="74" cy="100" rx="6" ry="4" fill="#E88A6A" opacity=".35"/>

  <!-- Haar über der Stirn, Scheitel mit Sindoor -->
  <path d="M36 88 C 35 66, 46 56, 60 56 C 74 56, 85 66, 84 88 C 81 74, 72 67, 60 68 C 48 67, 39 74, 36 88 Z" fill="#1B1010"/>
  <path d="M60 57 L 60 68" stroke="#D0182A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Stirnband der Krone mit Rubin-Medaillon -->
  <path d="M33 72 C 40 50, 80 50, 87 72 L 83 74 C 76 57, 44 57, 37 74 Z" fill="url(#gold)" stroke="#7A4308" stroke-width=".6"/>
  <path class="beads" d="M36 70 C 43 55, 77 55, 84 70"/>
  <path d="M60 30 C 70 38, 70 50, 60 58 C 50 50, 50 38, 60 30 Z" fill="url(#gold)" stroke="#7A4308" stroke-width=".7"/>
  <path class="beads" d="M60 34 C 67 40, 67 49, 60 55 C 53 49, 53 40, 60 34"/>
  <ellipse cx="60" cy="44.5" rx="4" ry="5" fill="url(#ruby)"/>
  <ellipse cx="58.6" cy="42.8" rx="1.1" ry="1.4" fill="#FFFFFF" opacity=".7"/>

  <!-- Drittes Auge -->
  <path d="M60 71.5 C 62.6 74, 62.6 78, 60 80.5 C 57.4 78, 57.4 74, 60 71.5 Z" fill="#FFFFFF" stroke="#1B1010" stroke-width=".9"/>
  <circle cx="60" cy="76" r="1.5" fill="url(#iris)"/>
  <circle cx="60" cy="76" r=".6" fill="#000"/>
  <!-- Bindi -->
  <circle cx="60" cy="84" r="1.5" fill="#D0182A"/>

  <!-- Augenbrauen -->
  <path d="M41 84 C 45 79.5, 52 79, 57 82 C 52 80.8, 46 81.2, 41 84 Z" fill="#1B1010" stroke="#1B1010" stroke-width=".8" stroke-linejoin="round"/>
  <path d="M79 84 C 75 79.5, 68 79, 63 82 C 68 80.8, 74 81.2, 79 84 Z" fill="#1B1010" stroke="#1B1010" stroke-width=".8" stroke-linejoin="round"/>

  <!-- Augen: groß, mandelförmig, mit Kajal -->
  <g>
    <path d="M42 90 C 45 85.5, 53 85, 57.5 89 C 53 92, 46 92.5, 42 90 Z" fill="#FFFBF2"/>
    <circle cx="50.5" cy="88.6" r="2.6" fill="url(#iris)"/>
    <circle cx="50.5" cy="88.6" r="1.1" fill="#000"/>
    <circle cx="51.4" cy="87.8" r=".55" fill="#FFF"/>
    <path d="M38.5 88.5 L 42 90 C 45 85.5, 53 85, 57.5 89" fill="none" stroke="#1B1010" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 90 C 46 92.5, 53 92, 57.5 89" fill="none" stroke="#1B1010" stroke-width=".7"/>
  </g>
  <g transform="translate(120 0) scale(-1 1)">
    <path d="M42 90 C 45 85.5, 53 85, 57.5 89 C 53 92, 46 92.5, 42 90 Z" fill="#FFFBF2"/>
    <circle cx="50.5" cy="88.6" r="2.6" fill="url(#iris)"/>
    <circle cx="50.5" cy="88.6" r="1.1" fill="#000"/>
    <circle cx="49.6" cy="87.8" r=".55" fill="#FFF"/>
    <path d="M38.5 88.5 L 42 90 C 45 85.5, 53 85, 57.5 89" fill="none" stroke="#1B1010" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 90 C 46 92.5, 53 92, 57.5 89" fill="none" stroke="#1B1010" stroke-width=".7"/>
  </g>

  <!-- Nase -->
  <path d="M58.8 91 C 58.4 96, 57 99.5, 56.6 101.4 C 58 103, 62 103, 63.4 101.4" fill="none" stroke="#B06A3A" stroke-width=".8" stroke-linecap="round"/>
  <!-- Nasenring mit Kette zum Ohrschmuck -->
  <circle cx="64.4" cy="103.4" r="3" fill="none" stroke="#E9AE2F" stroke-width=".9"/>
  <path d="M66.8 105 C 74 108, 80 104, 83 99" fill="none" stroke="#F6D270" stroke-width=".7" stroke-linecap="round" stroke-dasharray="0 1.6"/>

  <!-- Lippen -->
  <path d="M53 109 C 56 106.8, 58.5 107.6, 60 108.2 C 61.5 107.6, 64 106.8, 67 109 C 64 113, 56 113, 53 109 Z" fill="#B3121C"/>
  <path d="M53 109 C 57 109.8, 63 109.8, 67 109" fill="none" stroke="#6E0610" stroke-width=".6"/>
  <ellipse cx="61.5" cy="111" rx="2" ry=".6" fill="#FF8A8A" opacity=".5"/>
</svg>
